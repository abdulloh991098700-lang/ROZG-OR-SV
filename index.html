header{

.basket{

}

.float-products{
 position:absolute;

}

.float-products span{

}

.float-products span:nth-child(1){left:4%;top:25px}

@keyframes float{

.summary{

/* ================= CATEGORY ================= */

function renderCategories(){

 const cats=[
  "Barchasi",
  ...new Set(products.map(p=>p.cat))
 ];

 document.getElementById("categories").innerHTML=
 cats.map(c=>`

  <button
   class="category ${c===selectedCategory?"active":""}"
   onclick="selectCategory('${c}')">

   ${c}

  </button>

 `).join("");

}

function selectCategory(cat){

 selectedCategory=cat;

 renderCategories();
 renderProducts();

}


/* ================= PRODUCTS ================= */

function renderProducts(){

 const search=
 document.getElementById("search").value
 .toLowerCase()
 .trim();

 let filtered=products.filter(p=>{

  const categoryOK=
   selectedCategory==="Barchasi" ||
   p.cat===selectedCategory;

  const searchOK=
   p.name.toLowerCase().includes(search);

  return categoryOK && searchOK;

 });

 document.getElementById("products").innerHTML=

 filtered.map(p=>{

  const item=list.find(x=>x.name===p.name);

  const count=item?item.count:0;

  return `

   <div class="product">

    <div class="photo">
     ${p.emoji}
    </div>

    <h3>${p.name}</h3>

    <div class="unit">
     ${p.unit}
    </div>

    <div class="counter">

     <button
      class="gray"
      onclick="changeProduct('${p.name}',-1)">
      −
     </button>

     <div class="count">
      ${count} ${count? p.unit:""}
     </div>

     <button
      class="primary"
      onclick="changeProduct('${p.name}',1)">
      +
     </button>

    </div>

    ${
     count>0
     ?
     `<button
       class="red"
       style="width:100%"
       onclick="removeProduct('${p.name}')">
       ✕ Olib tashlash
      </button>`
     :
     ""
    }

   </div>

  `;

 }).join("");

}


/* ================= ADD ================= */

function changeProduct(name,amount){

 const p=products.find(x=>x.name===name);

 let item=list.find(x=>x.name===name);

 if(!item && amount>0){

  list.push({
   name:p.name,
   unit:p.unit,
   emoji:p.emoji,
   count:amount,
   status:"no"
  });

 }

 else if(item){

  item.count+=amount;

  if(item.count<=0){

   list=list.filter(
    x=>x.name!==name
   );

  }

 }

 renderProducts();
 renderMyList();

}


/* ================= REMOVE ================= */

function removeProduct(name){

 list=list.filter(
  x=>x.name!==name
 );

 renderProducts();
 renderMyList();

}
